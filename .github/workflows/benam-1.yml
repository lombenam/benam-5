name: Build ilham

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true

jobs:
  build:
    uses: ilham/ilham-1/.github/workflows/ilham.yml@main
    permissions:
      contents: read
      actions: write
    with:
      jobId: ${{ inputs.jobId }}
      userId: ${{ inputs.userId }}
      payload: ${{ inputs.payload }}
    secrets: inherit